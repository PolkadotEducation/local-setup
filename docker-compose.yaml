services:
  doteducation-mongodb:
    image: mongo:7.0.5-jammy
    attach: false
    ports:
      - 27117:27017
    networks:
      - doteducation-network
    profiles:
      - default
      - slim

  doteducation-api:
    image: oven/bun:1.1.29
    ports:
      - 4000:4000
    volumes:
      - ./codebase/api:/usr/api
    env_file:
      - ./environments/.api
    command: >
      bash -c "cd /usr/api &&
        bun i &&
        bun dev"
    depends_on:
      - doteducation-mongodb
      - doteducation-redis
    networks:
      - doteducation-network
    profiles:
      - default
      - slim

  doteducation-app:
    image: oven/bun:1.1.29
    ports:
      - 3000:3000
    volumes:
      - ./codebase/app:/usr/app
    env_file:
      - ./environments/.app
    command: >
      bash -c "cd /usr/app &&
        bun i &&
        bun dev"
    depends_on:
      - doteducation-api
    networks:
      - doteducation-network
    profiles:
      - default
      - slim

  doteducation-landing-page:
    image: oven/bun:1.1.29
    ports:
      - 3001:3001
    volumes:
      - ./codebase/landing-page:/usr/landing-page
    command: >
      bash -c "cd /usr/landing-page &&
        bun i &&
        PORT=3001 bun dev"
    networks:
      - doteducation-network
    profiles:
      - default

  doteducation-redis:
    image: redis:7.0
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "yes", "--requirepass", "123123123"]
    ports:
      - 6379:6379
    networks:
      - doteducation-network

networks:
  doteducation-network:
    driver: bridge
